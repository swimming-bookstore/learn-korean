<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Patchim: can you tell 기 from 그">
  <rect width="1080" height="1080" fill="#fff9ef"/>

  <text x="540" y="90" text-anchor="middle" font-family="Lato, Outfit, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="7.2" fill="#6a5c4e">KOREAN ESSENTIAL</text>
  <text y="176" fill="#1d3550" font-weight="700">
    <tspan x="212" font-family="Liberation Serif, serif" font-size="48">Patchim: can you tell </tspan>
    <tspan font-family="Noto Serif CJK KR, serif" font-size="52">기</tspan>
    <tspan font-family="Liberation Serif, serif" font-size="48"> from </tspan>
    <tspan font-family="Noto Serif CJK KR, serif" font-size="52">그</tspan>
  </text>
  <text y="236" fill="#6a5c4e">
    <tspan x="438" font-family="Liberation Serif, serif" font-size="28">Example: </tspan>
    <tspan font-family="Noto Serif CJK KR, serif" font-size="30">그</tspan>
    <tspan font-family="Liberation Serif, serif" font-size="28"> (that)</tspan>
  </text>

  <rect x="56" y="278" width="968" height="652" fill="#fff9ef" stroke="#1d3550" stroke-width="2"/>
  <rect x="540" y="278" width="484" height="652" fill="#1d3550" fill-opacity="0.045"/>
  <line x1="540" y1="278" x2="540" y2="930" stroke="#1d3550" stroke-width="2"/>

  <text x="298.0" y="500" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK KR, serif" font-size="188" fill="#1d3550">기</text>
  <text x="782.0" y="500" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK KR, serif" font-size="188" fill="#1d3550">그</text>
  <text x="298.0" y="700" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK KR, serif" font-size="84" fill="#1d3550">ㄱ</text>
  <text x="782.0" y="700" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK KR, serif" font-size="84" fill="#1d3550">ㄱ</text>

  <rect x="302" y="806" width="16" height="31" fill="#1d3550"/>
  <rect x="757" y="806" width="54" height="31" fill="#1d3550"/>
  <text x="279" y="832" font-family="Liberation Serif, serif" font-size="44" font-weight="700" fill="#1d3550">g</text>
  <text x="308" y="832" font-family="Liberation Serif, serif" font-size="44" font-weight="700" fill="#fff9ef">i</text>
  <text x="734" y="832" font-family="Liberation Serif, serif" font-size="44" font-weight="700" fill="#1d3550">g</text>
  <text x="763" y="832" font-family="Liberation Serif, serif" font-size="44" font-weight="700" fill="#fff9ef">eu</text>

  <text x="540" y="998" text-anchor="middle" font-family="Noto Serif CJK KR, Liberation Serif, serif" font-size="20" fill="#6a5c4e">© 수영 책방 Swimming Bookstore</text>
