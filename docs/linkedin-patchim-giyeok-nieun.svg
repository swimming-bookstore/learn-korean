  <rect x="56" y="278" width="968" height="652" fill="#fff9ef" stroke="#1d3550" stroke-width="2"/>
  <rect x="540" y="278" width="484" height="652" fill="#1d3550" fill-opacity="0.045"/>
  <line x1="540" y1="278" x2="540" y2="930" stroke="#1d3550" stroke-width="2"/>

  <text x="298.0" y="500" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK KR, serif" font-size="188" fill="#1d3550">악</text>
  <text x="782.0" y="500" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK KR, serif" font-size="188" fill="#1d3550">안</text>
  <text x="298.0" y="700" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK KR, serif" font-size="84" fill="#1d3550">ㄱ</text>
  <text x="782.0" y="700" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK KR, serif" font-size="84" fill="#1d3550">ㄴ</text>

  <rect x="296.0" y="796.0" width="38.0" height="41.0" fill="#1d3550"/>
  <rect x="780.0" y="796.0" width="37.0" height="41.0" fill="#1d3550"/>
  <text x="270.0" y="832" font-family="Liberation Serif, serif" font-size="44" font-weight="700" fill="#1d3550">a</text>
